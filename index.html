<!doctype html><html><head><meta charset="utf-8"><title>LOST & FOUND</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050607;color:#c9cfd2;font-family:Georgia,'Times New Roman',serif;overflow:hidden;user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,7,.82);backdrop-filter:blur(3px);z-index:5}
.ov.on{display:flex}
.panel{width:min(760px,92vw);max-height:88vh;overflow:auto;background:#0d1012;border:1px solid #2b3236;padding:22px 26px;box-shadow:0 20px 60px #000}
h1{font-weight:400;letter-spacing:.5em;font-size:clamp(28px,5vw,56px);margin:0;color:#e3dccb}
h2{font-weight:400;letter-spacing:.25em;font-size:15px;margin:0 0 12px;color:#b9a77a;text-transform:uppercase}
.sub{letter-spacing:.3em;font-size:12px;color:#7d878b;margin:10px 0 34px}
button{font:inherit;background:transparent;color:#c9cfd2;border:1px solid #2f383c;padding:9px 16px;margin:4px;cursor:pointer;letter-spacing:.15em;font-size:12px;text-transform:uppercase;transition:.2s}
button:hover{border-color:#b9a77a;color:#fff;background:#161b1e}
#menu{flex-direction:column;background:radial-gradient(ellipse at 50% 70%,#18232b 0,#050607 70%)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff8;border-radius:50%}
#prompt{position:absolute;left:50%;top:56%;transform:translateX(-50%);font-size:13px;letter-spacing:.15em;color:#e3dccb;text-shadow:0 0 6px #000}
#sub{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:min(780px,90vw);text-align:center;font-size:17px;color:#e8e6df;text-shadow:0 0 8px #000,0 0 3px #000}
#info{position:absolute;top:14px;left:18px;font-size:11px;letter-spacing:.2em;color:#8b969a}
.chip{display:inline-block;border:1px solid #3a4549;padding:6px 10px;margin:5px;background:#12171a;font-size:13px;position:relative;z-index:2}
.row{margin:6px 0;font-size:14px;line-height:1.5}.dim{color:#6f797d}
input[type=range]{width:200px;vertical-align:middle}input[type=text]{background:#12171a;border:1px solid #2f383c;color:#ddd;padding:7px;width:100%;font:inherit}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity 1.2s;display:flex;align-items:center;justify-content:center;letter-spacing:.4em;color:#b9a77a}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div id="cross"></div><div id="prompt"></div><div id="sub"></div><div id="info"></div></div>
<div id="menu" class="ov on"><h1>LOST &amp; FOUND</h1><div class="sub">EVERY OBJECT HAS A STORY</div><div id="mbtn"></div><div id="merr" style="color:#a66;margin-top:20px"></div></div>
<div id="ov" class="ov"><div class="panel" id="panel"></div></div>
<div id="fade"></div>
<script type="module" src="/src/main.js"></script></body></html>
